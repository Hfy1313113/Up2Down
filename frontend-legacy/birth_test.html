<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>birth test</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 截图时冻结在旋转中途，便于检查 */
  #birth-flip { animation-delay: -1.6s !important; }
  #birth-text { animation-delay: -0.7s !important; }
</style>
</head>
<body>
<div id="screen-birth" class="screen">
  <canvas id="birth-confetti"></canvas>
  <div id="birth-text">🎉 你的小马诞生啦！🎉</div>
  <div id="birth-stage">
    <div id="birth-flip"><canvas id="birth-canvas"></canvas></div>
  </div>
  <p class="hint birth-hint">拖动可 360° 旋转观察你的小马</p>
  <div class="birth-bottom">
    <span id="birth-timer">12s 后可进入比赛</span>
    <button id="btn-to-race" class="btn primary big">进入比赛 →</button>
  </div>
</div>
<script src="js/recognize.js"></script>
<script src="js/horse.js"></script>
<script src="js/birth.js"></script>
<script>
// 合成一匹马并展示诞生仪式（冻结帧供截图）
function synthParts() {
  const legs = [];
  const L1 = 78, L2 = 74;
  [140, 175, 265, 300].forEach((hx, i) => {
    const dir = (i % 2 ? 1 : -1);
    const pts = [];
    for (let j = 0; j <= 14; j++) {
      const t = j / 14;
      if (t < 0.5) { const u = t / 0.5; pts.push([hx + dir * 8 * u, 175 + u * L1]); }
      else { const u = (t - 0.5) / 0.5; pts.push([hx + dir * 8 - dir * 28 * u, 175 + L1 + u * L2]); }
    }
    legs.push({ points: pts });
  });
  return {
    legs,
    head: [{ points: [[325, 165], [350, 120], [368, 100], [378, 108], [372, 128]] }],
    butt: [{ points: [[122, 165], [95, 185], [82, 215]] }],
  };
}
const model = Recognize.analyzeParts(synthParts());
// 不自动结束：覆盖按钮行为
document.getElementById("btn-to-race").disabled = true;
Birth.show(model, "#e2604f", () => {});
document.getElementById("btn-to-race").disabled = false;
</script>
</body>
</html>
