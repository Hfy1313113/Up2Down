<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>harness - 分部位识别 / 步态 / 双视角验证</title>
<style>
  body { background: #233; margin: 0; font-family: sans-serif; }
  canvas { display: block; margin: 8px; }
  #log { color: #9fd48a; font: 13px monospace; padding: 8px; white-space: pre; }
</style>
</head>
<body>
<canvas id="montage" width="1280" height="1560"></canvas>
<canvas id="track" width="1280" height="720"></canvas>
<canvas id="track2" width="1280" height="720"></canvas>
<div id="log"></div>
<script src="js/recognize.js"></script>
<script src="js/horse.js"></script>
<script src="js/race.js"></script>
<script>
// 分部位合成笔画：{legs:[4条], head:[...], butt:[...]}
function synthParts({ legLen = 150, ratio = 1.05, hips = [140, 175, 265, 300] }) {
  const legs = [];
  const L1 = legLen * ratio / (1 + ratio), L2 = legLen / (1 + ratio);
  hips.forEach((hx, i) => {
    const dir = (i % 2 ? 1 : -1);
    const pts = [];
    for (let j = 0; j <= 14; j++) {
      const t = j / 14;
      let x, y;
      if (t < 0.5) {
        const u = t / 0.5;
        x = hx + dir * 8 * u; y = 175 + u * L1;
      } else {
        const u = (t - 0.5) / 0.5;
        x = hx + dir * 8 - dir * 28 * u; y = 175 + L1 + u * L2;
      }
      pts.push([x, y]);
    }
    legs.push({ points: pts });
  });
  return {
    legs,
    head: [{ points: [[325, 165], [350, 120], [368, 100], [378, 108], [372, 128]] }],
    butt: [{ points: [[122, 165], [95, 185], [82, 215]] }],
  };
}

const variants = [
  { name: "A 均衡腿",   legLen: 150, ratio: 1.05 },
  { name: "B 大长腿",   legLen: 195, ratio: 1.05 },
  { name: "C 小短腿",   legLen: 105, ratio: 1.0 },
  { name: "D 比例失调", legLen: 185, ratio: 2.2 },
];

const log = [];
const montage = document.getElementById("montage").getContext("2d");
const COLORS = ["#e2604f", "#4d8de2", "#59b56b", "#e8a13c"];

const models = variants.map(v => Recognize.analyzeParts(synthParts(v)));

variants.forEach((v, vi) => {
  const model = models[vi];
  const m = Race.computeMetrics(model);
  log.push(`${v.name}: 腿数=${model.legs.length} ` +
    model.legs.map(l => `L1=${l.L1.toFixed(0)},L2=${l.L2.toFixed(0)}${l.synthesized ? "(合成)" : ""}`).join(" | ") +
    `  →  speed=${m.speed.toFixed(1)}px/s cadence=${m.cadence.toFixed(2)}`);

  const phases = [0, 0.25, 0.5, 0.75];
  phases.forEach((ph, pi) => {
    const cx = 170 + pi * 300, cy = 330 + vi * 360;
    const pose = Horse.computePose(model, ph);
    montage.strokeStyle = "#8a6";
    montage.lineWidth = 2;
    montage.beginPath(); montage.moveTo(cx - 130, cy); montage.lineTo(cx + 130, cy); montage.stroke();
    Horse.draw(montage, model, pose, cx, cy, 0.9, COLORS[vi],
      { phase: ph, showJoints: true, jointColor: "#ffe27a" });
    montage.fillStyle = "#cde";
    montage.font = "13px monospace";
    montage.fillText(`${v.name} φ=${ph}`, cx - 50, cy + 20);
  });
  montage.fillStyle = "#fff";
  montage.font = "bold 15px monospace";
  montage.fillText(`${v.name}  speed=${m.speed.toFixed(0)}`, 20, 250 + vi * 360);
});

// 第三视角：模拟 6 秒
const entries = variants.map((v, i) => ({ name: v.name, model: models[i] }));
const race = Race.create(document.getElementById("track"), entries, { playerIndex: 1 });
for (let t = 0; t < 6; t += 1 / 30) race.update(1 / 30);
race.render();
log.push(`6秒排名(第三视角): ${race.ranking().map(r => r.name).join(" > ")}`);

// 第一视角：同一场比赛，从 B(序号1) 的眼睛看
const race2 = Race.create(document.getElementById("track2"), entries, { playerIndex: 1 });
for (let t = 0; t < 6; t += 1 / 30) race2.update(1 / 30);
race2.setView("first");
race2.render();

document.getElementById("log").textContent = log.join("\n");
document.title = "harness done";
</script>
</body>
</html>
