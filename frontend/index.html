<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画马赛跑 · Draw-a-Horse Race</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 大厅 -->
<div id="screen-lobby" class="screen">
  <div class="panel">
    <h1>🐎 画马赛跑</h1>
    <p class="subtitle">分部位画出你的小马 · 腿的关节决定它的速度</p>
    <div id="join-form">
      <input id="inp-name" type="text" maxlength="12" placeholder="你的昵称">
      <input id="inp-room" type="text" maxlength="20" placeholder="房间号（留空进默认房）">
      <button id="btn-join" class="btn primary">进入房间</button>
    </div>
    <div id="lobby-wait" class="hidden">
      <h2>房间 <span id="lobby-room"></span></h2>
      <p>玩家列表（<span id="lobby-count"></span>/4）：</p>
      <ul id="lobby-players"></ul>
      <p class="hint" id="lobby-hint">等待房主开始比赛…</p>
      <button id="btn-start" class="btn primary hidden">开始比赛（每个部位 50 秒作画时间）</button>
    </div>
    <p class="error hidden" id="lobby-error"></p>
  </div>
</div>

<!-- 分部位绘制 -->
<div id="screen-draw" class="screen hidden">
  <div class="draw-top">
    <div class="countdown" id="draw-countdown">50</div>
    <div class="part-tabs" id="part-tabs">
      <div class="part-tab active" data-part="legs">1️⃣ 腿部</div>
      <div class="part-tab" data-part="head">2️⃣ 头部</div>
      <div class="part-tab" data-part="butt">3️⃣ 屁股</div>
    </div>
    <div class="draw-status" id="draw-status"></div>
  </div>
  <div class="canvas-wrap">
    <canvas id="draw-canvas" width="960" height="640"></canvas>
  </div>
  <div class="draw-tools">
    <button id="btn-undo" class="btn">↩ 撤销</button>
    <button id="btn-clear" class="btn">🗑 清空本部位</button>
    <label class="chk"><input type="checkbox" id="chk-preview"> 骨骼预览</label>
    <button id="btn-part-done" class="btn primary big">✔ 完成本部位</button>
  </div>
  <p class="hint center" id="draw-hint">腿部：画出<b>四条向下伸出的长线</b>，中间带明显弯折（弯折处就是膝关节）。大腿:小腿≈1:1 跑得最快！</p>
</div>

<!-- 诞生仪式 -->
<div id="screen-birth" class="screen hidden">
  <canvas id="birth-confetti"></canvas>
  <div id="birth-text">🎉 你的小马诞生啦！🎉</div>
  <div id="birth-stage">
    <div id="birth-flip"><canvas id="birth-canvas"></canvas></div>
  </div>
  <p class="hint birth-hint">拖动可 360° 旋转观察你的小马</p>
  <div class="birth-bottom">
    <span id="birth-timer"></span>
    <button id="btn-to-race" class="btn primary big">进入比赛 →</button>
  </div>
</div>

<!-- 赛跑 -->
<div id="screen-race" class="screen hidden">
  <canvas id="race-canvas"></canvas>
  <div id="race-countdown" class="race-countdown hidden">3</div>
  <div class="view-switch">
    <button id="btn-view-third" class="btn view-btn active">👁 旁观视角</button>
    <button id="btn-view-first" class="btn view-btn">🐴 马儿视角</button>
  </div>
  <div id="race-banner" class="race-banner hidden">
    <h1 id="race-result-title"></h1>
    <ol id="race-podium"></ol>
    <button id="btn-again" class="btn primary">再来一局</button>
  </div>
</div>

<script src="js/net.js"></script>
<script src="js/recognize.js"></script>
<script src="js/horse.js"></script>
<script src="js/race.js"></script>
<script src="js/draw.js"></script>
<script src="js/birth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
