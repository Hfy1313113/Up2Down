<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 抽象 · Up2Down：抽象大象头剪影 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#d9480f"/>
  <g fill="#fff8ec">
    <!-- 大扇耳 -->
    <ellipse cx="20" cy="30" rx="12" ry="15" transform="rotate(-12 20 30)"/>
    <!-- 头 -->
    <circle cx="35" cy="28" r="14"/>
    <!-- 象鼻：垂下并回卷 -->
    <path d="M44 36 C 50 42, 52 50, 46 56 C 42 60, 36 57, 38 52 C 39 50, 42 50, 42 53" stroke="#fff8ec" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 象牙 -->
  <path d="M40 40 q 4 4 10 2" stroke="#e3b23c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 眼睛 -->
  <circle cx="39" cy="25" r="2.2" fill="#3b1f0e"/>
</svg>
